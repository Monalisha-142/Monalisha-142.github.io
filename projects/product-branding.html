<style>
  /* The OneByTwo case study (Figma "Branding and Marketing" › "Product branding", 1440 × 14002),
     under the Product Branding card. The frame is shown as its 19 sections, exported at 2× so
     it stays sharp; its Nav becomes the portfolio's case-study bar (the same as the other
     projects, in the brand's colours). Kept from the Figma prototype: the chapter links, the
     collateral strip that scrolls sideways (its golden bar fills as it goes) and the full
     Gantt chart that opens over the page. */
  :root {
    --bg: #f7efe7; --ink: #2e1a10; --brown: #643315; --tan: #7a4a33; --line: #e8cdb2;
    --sand: #ebd3c1; --gold: #f3d58a;
  }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: 'Inter', system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---- the case study: the sections one under another, each a 2× picture ---- */
  .study { position: relative; container-type: inline-size; }
  .sec { position: relative; --k: calc(100cqw / 1440); }
  .sec > img { display: block; width: 100%; height: auto; }
  .sec[id] { scroll-margin-top: 56px; }

  /* ---- Brand visibility: the collaterals scroll sideways in a 942 × 512 window ---- */
  .strip {
    position: absolute; left: calc(405 * var(--k)); top: calc(196 * var(--k));
    width: calc(942 * var(--k)); height: calc(512 * var(--k));
    overflow-x: auto; overflow-y: hidden; background: var(--sand);
    scrollbar-width: none; overscroll-behavior-x: contain; cursor: grab; outline: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip.dragging { cursor: grabbing; scroll-behavior: auto; }
  .strip:focus-visible { box-shadow: 0 0 0 2px var(--brown); }
  .track { position: relative; width: calc(4272 * var(--k)); height: 100%; }
  .track img {
    position: absolute; top: calc(8 * var(--k)); left: calc(var(--x) * var(--k));
    width: calc(var(--w) * var(--k)); height: calc(489 * var(--k));
    -webkit-user-drag: none; user-select: none; pointer-events: none;
  }
  /* the golden bar (Figma "Scroll hint" › Progress, 160 × 3): it fills from the left as
     the strip goes right, and empties again going back, like the bar's progress line */
  .hint-bar {
    position: absolute; left: calc(990 * var(--k)); top: calc(180 * var(--k));
    width: calc(160 * var(--k)); height: max(2px, calc(3 * var(--k))); border-radius: 2px; overflow: hidden;
    background: #a27e3f;   /* 40% pale yellow over the brown pill, as in Figma */
  }
  .hint-bar i { position: absolute; inset: 0; background: var(--gold); border-radius: 2px; transform-origin: 0 50%; transform: scaleX(.34); transition: transform .25s ease-out; }
  .hint-go { position: absolute; left: calc(1158 * var(--k)); top: calc(172 * var(--k)); width: calc(194 * var(--k)); height: calc(20 * var(--k)); border-radius: 10px; }
  .hint-go:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- Gantt chart: the thumbnail and "View full Gantt" open the detailed plan ---- */
  .open-gantt { position: absolute; border-radius: calc(14 * var(--k)); }
  .open-gantt.thumb { left: calc(649 * var(--k)); top: calc(326 * var(--k)); width: calc(688 * var(--k)); height: calc(435 * var(--k)); }
  .open-gantt.cta { left: calc(90 * var(--k)); top: calc(720 * var(--k)); width: calc(229 * var(--k)); height: calc(41 * var(--k)); border-radius: 999px; }
  .open-gantt:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .open-gantt.thumb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: rgba(46, 26, 16, 0); transition: background .25s; }
  .open-gantt.thumb:hover::after { background: rgba(46, 26, 16, .06); }

  .overlay {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 2vh 2vw;
    background: rgba(46, 26, 16, .55); opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel {
    position: relative; width: min(1360px, 96vw); height: min(900px, 94vh); box-sizing: border-box;
    padding: 30px 32px 32px; background: var(--bg); border-radius: 18px; display: flex; flex-direction: column;
    box-shadow: 0 30px 80px rgba(46, 26, 16, .35); transform: translateY(10px); transition: transform .3s ease;
  }
  .overlay.open .panel { transform: none; }
  .panel .kicker { margin: 0; font: 500 12px/15px 'Inter', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--tan); }
  .panel h2 { margin: 19px 0 0; font: 400 26px/29px 'Hubballi', sans-serif; color: var(--ink); padding-right: 300px; }
  .panel .tip { position: absolute; right: 94px; top: 71px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tan); }
  .panel .close { position: absolute; right: 32px; top: 53px; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
  .panel .close svg { width: 14px; height: 14px; stroke: var(--bg); stroke-width: 1.8; stroke-linecap: round; }
  .panel .close:focus-visible { outline: 2px solid var(--brown); outline-offset: 3px; }
  .viewer { flex: 1; margin-top: 19px; overflow: auto; background: #fff; border-radius: 6px; cursor: grab; overscroll-behavior: contain; }
  .viewer.dragging { cursor: grabbing; }
  .viewer .tiles { display: grid; grid-template-columns: repeat(2, 2796px); width: 5592px; }
  .viewer img { display: block; width: 2796px; height: 1752px; -webkit-user-drag: none; user-select: none; }
  @media (max-width: 760px) {
    .panel { padding: 20px 16px 16px; border-radius: 14px; }
    .panel h2 { font-size: 20px; line-height: 23px; padding-right: 48px; }
    .panel .tip { display: none; }
    .panel .close { right: 14px; top: 14px; }
    .viewer .tiles { grid-template-columns: repeat(2, 1398px); width: 2796px; }
    .viewer img { width: 1398px; height: 876px; }
  }

  /* ---- the bar: the same as the other case studies, in OneByTwo's colours ---- */
  .bar {
    position: fixed; inset: 0 0 auto 0; height: 57.6px; z-index: 10; display: flex; align-items: center; gap: 19.8px; padding: 0 36px;
    background: rgba(247, 239, 231, .94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 1px 0 var(--line);
  }
  .home { display: flex; align-items: center; gap: 12.6px; flex-shrink: 0; }
  .mono { width: 36px; height: 20.7px; overflow: visible; }
  .mono path { fill: none; stroke: var(--brown); stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
  .home .sep { width: 1px; height: 16px; background: rgba(100, 51, 21, .5); }
  .back { font-size: 10.8px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--brown); transition: color .25s; }
  .back:hover, .back:focus-visible { color: var(--ink); }
  /* the line along the bar's bottom edge fills as you read */
  .progress { position: absolute; left: 0; bottom: 0; height: 1.4px; width: 100%; background: var(--brown); transform-origin: 0 50%; transform: scaleX(0); }

  .o1 nav { margin-left: auto; }
  .chapters { position: relative; display: flex; gap: 22px; list-style: none; margin: 0; padding: 0; }
  .chapters a { display: block; padding: 7px 0; font-size: 10.8px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--tan); transition: color .25s; white-space: nowrap; }
  .chapters a:hover, .chapters a:focus-visible { color: var(--ink); }
  .chapters a[aria-current="true"] { color: var(--ink); }
  .chapters .mark { position: absolute; bottom: 2px; left: 0; height: 1px; width: 0; background: var(--brown); transition: left .45s cubic-bezier(.3, .7, .2, 1), width .45s cubic-bezier(.3, .7, .2, 1), opacity .3s; opacity: 0; }
  @media (max-width: 1180px) and (min-width: 761px) { .chapters { gap: 12px; } .chapters a { letter-spacing: .07em; } }
  @media (max-width: 980px) and (min-width: 761px) { .o1 .home .sep, .o1 .home .back { display: none; } .chapters { gap: 9px; } .chapters a { font-size: 10px; letter-spacing: .04em; } }

  /* phones: the current chapter in the bar, the rest in a dropdown */
  .o4, .sheet { display: none; }
  @media (max-width: 760px) {
    .o1 { display: none !important; }
    .o4 { display: flex; }
    .bar { height: 54px; padding: 0 12px 0 14px; gap: 10px; }
    .o4 .home .back { display: none; }
    .o4 .mono { width: 34px; height: 20px; }
    .now {
      margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 18px;
      background: rgba(247, 239, 231, .9); font: 500 12px/1 'Inter', system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
    }
    .now b { font-weight: 400; color: var(--tan); }
    .now svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1.6; transition: transform .3s; }
    .now[aria-expanded="true"] svg { transform: rotate(180deg); }
    .sheet {
      display: block; position: fixed; left: 10px; right: 10px; top: 62px; z-index: 11; margin: 0; padding: 8px; list-style: none;
      background: #fbf6f1; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(46, 26, 16, .18);
      opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.3, .7, .2, 1);
    }
    .sheet.open { opacity: 1; transform: none; pointer-events: auto; }
    .sheet a { display: flex; gap: 14px; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--tan); }
    .sheet a b { font-weight: 400; width: 20px; color: rgba(122, 74, 51, .6); }
    .sheet a[aria-current="true"] { background: rgba(100, 51, 21, .1); color: var(--ink); }
    .sheet .all { margin-top: 4px; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; font-size: 12px; }
    .sec[id] { scroll-margin-top: 52px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition-duration: .01s !important; } }
</style>

<script>
  // The chapters, as the Figma Nav has them: the name, and the section it scrolls to.
  const CHAPTERS = [
    ['Overview', 'overview'], ['Research', 'research'], ['Insight', 'insight'], ['Brand', 'brand'],
    ['Packaging', 'packaging'], ['Campaign', 'campaign'], ['Marketing', 'marketing'], ['Plan', 'plan'], ['Launch', 'launch'],
  ];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const num = i => String(i + 1).padStart(2, '0');
  const chapters = document.querySelector('.chapters'), sheet = document.querySelector('.sheet');
  const mark = document.createElement('span'); mark.className = 'mark'; chapters.appendChild(mark);
  CHAPTERS.forEach(([name, id]) => {
    chapters.insertAdjacentHTML('beforeend', `<li><a href="#${id}">${name}</a></li>`);
  });
  CHAPTERS.forEach(([name, id], i) => sheet.insertAdjacentHTML('beforeend', `<li><a href="#${id}"><b>${num(i)}</b>${name}</a></li>`));
  sheet.insertAdjacentHTML('beforeend', `<li><a class="all" href="../index.html#all-projects"><b>←</b>All projects</a></li>`);

  // the monogram's traced line, fitted to its box
  {
    const sketch = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    sketch.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;height:10px';
    sketch.innerHTML = `<path d="${document.querySelector('.mono path').getAttribute('d')}"/>`;
    document.body.appendChild(sketch);
    const b = sketch.firstChild.getBBox(), pad = 2.5; sketch.remove();
    document.querySelectorAll('.mono').forEach(s => s.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.width + 2 * pad} ${b.height + 2 * pad}`));
  }

  // the chapter links scroll to their section (Figma: Scroll to, animated)
  const secs = CHAPTERS.map(([, id]) => document.getElementById(id));
  document.querySelectorAll('.chapters a, .sheet a[href^="#"]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
    closeSheet();
  }));

  // where you are: the line along the bar fills, the current chapter is underlined
  const progress = [...document.querySelectorAll('.progress')], nowLabel = document.querySelector('.now-label');
  const barH = () => innerWidth <= 760 ? 54 : 57.6;
  let current = -2;
  function update() {
    const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
    progress.forEach(p => p.style.transform = `scaleX(${max > 0 ? (y / max).toFixed(4) : 0})`);
    let on = -1;
    secs.forEach((s, i) => { if (y + barH() + 60 >= s.offsetTop) on = i; });
    if (max > 0 && y >= max - 2) on = CHAPTERS.length - 1;
    if (on === current) return;
    current = on;
    document.querySelectorAll('.chapters a, .sheet a[href^="#"]').forEach(a => {
      const i = CHAPTERS.findIndex(c => '#' + c[1] === a.getAttribute('href'));
      a.setAttribute('aria-current', i === on ? 'true' : 'false');
    });
    const link = on >= 0 ? chapters.querySelectorAll('a')[on] : null;
    if (link) { mark.style.left = link.offsetLeft + 'px'; mark.style.width = link.offsetWidth + 'px'; mark.style.opacity = 1; } else mark.style.opacity = 0;
    nowLabel.innerHTML = on >= 0 ? `<b>${num(on)}</b> ${CHAPTERS[on][0]}` : 'Overview';
  }
  addEventListener('scroll', update, { passive: true });
  addEventListener('resize', () => { current = -2; update(); });
  addEventListener('load', () => { current = -2; update(); });
  update();

  // phones: the chapter dropdown
  const nowBtn = document.querySelector('.now');
  function closeSheet() { sheet.classList.remove('open'); nowBtn.setAttribute('aria-expanded', 'false'); }
  nowBtn.addEventListener('click', () => { const open = !sheet.classList.contains('open'); sheet.classList.toggle('open', open); nowBtn.setAttribute('aria-expanded', open); });
  addEventListener('click', e => { if (!e.target.closest('.sheet, .now')) closeSheet(); });

  // drag to move a scrolling box with the mouse (touch scrolls it natively)
  function draggable(box, axes) {
    let start = null;
    box.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY, l: box.scrollLeft, t: box.scrollTop, moved: false };
      box.setPointerCapture(e.pointerId);
    });
    box.addEventListener('pointermove', e => {
      if (!start) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!start.moved && Math.hypot(dx, dy) < 4) return;
      start.moved = true; box.classList.add('dragging');
      box.scrollLeft = start.l - dx;
      if (axes === 'both') box.scrollTop = start.t - dy;
    });
    const end = () => { start = null; box.classList.remove('dragging'); };
    box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
  }

  // Brand visibility: the strip of collaterals, and its golden bar
  const strip = document.querySelector('.strip'), fill = document.querySelector('.hint-bar i');
  function fillBar() {
    const room = strip.scrollWidth - strip.clientWidth;
    const seen = strip.clientWidth / strip.scrollWidth;              // the share in view: the bar starts this full
    const p = room > 0 ? strip.scrollLeft / room : 1;
    fill.style.transform = `scaleX(${(seen + (1 - seen) * p).toFixed(4)})`;
  }
  strip.addEventListener('scroll', fillBar, { passive: true });
  addEventListener('resize', fillBar); addEventListener('load', fillBar); fillBar();
  draggable(strip, 'x');
  // with the pointer anywhere over Brand visibility, a sideways scroll (two fingers
  // left/right, or Shift + wheel) moves the strip; up and down always scroll the page
  const campaign = document.getElementById('campaign');
  campaign.addEventListener('wheel', e => {
    if (e.ctrlKey || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   // up/down (or pinch): the page
    if (e.target.closest('.strip')) return;                   // over the strip it scrolls sideways by itself
    e.preventDefault();
    strip.scrollLeft += e.deltaX * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? strip.clientWidth : 1);
  }, { passive: false });
  strip.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); strip.scrollBy({ left: strip.clientWidth * .6, behavior: reduce ? 'auto' : 'smooth' }); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); strip.scrollBy({ left: -strip.clientWidth * .6, behavior: reduce ? 'auto' : 'smooth' }); }
  });
  // "Scroll to see all collaterals →": a step along; at the end, back to the start
  document.querySelector('.hint-go').addEventListener('click', () => {
    const room = strip.scrollWidth - strip.clientWidth;
    strip.scrollTo({ left: strip.scrollLeft >= room - 2 ? 0 : Math.min(room, strip.scrollLeft + strip.clientWidth * .8), behavior: reduce ? 'auto' : 'smooth' });
  });

  // Gantt chart: the thumbnail or "View full Gantt" opens the plan over the page (Figma: overlay, dissolve 0.3 s)
  const gantt = document.getElementById('gantt'), viewer = gantt.querySelector('.viewer'), closeBtn = gantt.querySelector('.close');
  let opener = null;
  function openGantt(e) {
    opener = e.currentTarget;
    gantt.classList.add('open'); gantt.setAttribute('aria-hidden', 'false');
    document.documentElement.style.overflow = 'hidden';
    closeBtn.focus({ preventScroll: true });
  }
  function closeGantt() {
    if (!gantt.classList.contains('open')) return;
    gantt.classList.remove('open'); gantt.setAttribute('aria-hidden', 'true');
    document.documentElement.style.overflow = '';
    if (opener) opener.focus({ preventScroll: true });
  }
  document.querySelectorAll('.open-gantt').forEach(b => b.addEventListener('click', openGantt));
  closeBtn.addEventListener('click', closeGantt);
  gantt.addEventListener('click', e => { if (e.target === gantt) closeGantt(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') { closeGantt(); closeSheet(); } });
  draggable(viewer, 'both');
</script>
