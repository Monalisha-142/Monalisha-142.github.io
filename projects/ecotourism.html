<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefining Ecotourism · S Monalisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* The Ecotourism case study (Figma "Eco tourism" › Frame 3), under the System Thinking card.
     Desktop: Option 1 (portfolio header with reading progress; Option 2, the chapter thread
     on the side, is kept but off). Phone: Option 4 (chapter dropdown).
     The case study itself is a picture of the Figma frame (1440 × 22122), without its own Nav. */
  :root { --bg: #f5f6ee; --ink: #2f4a36; --green: #385940; --sage: #53775c; --line: rgba(83, 119, 92, .28); }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* no font boosting on phones */
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: 'Roboto', system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }

  /* the case study: the Figma frame, 1440 × 22122, in pieces */
  .study { position: relative; }
  .study img { display: block; width: 100%; height: auto; }
  .anchor { position: absolute; left: 0; width: 1px; height: 1px; top: calc(var(--y) / 22122 * 100%); }

  /* ---- shared bar ---- */
  .bar {
    position: fixed; inset: 0 0 auto 0; height: 57.6px; z-index: 10; display: flex; align-items: center; gap: 19.8px; padding: 0 36px;
    background: transparent; transition: background .35s ease, box-shadow .35s ease, transform .35s ease;
  }
  .bar.solid { background: rgba(245, 246, 238, .94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--line); }
  .home { display: flex; align-items: center; gap: 12.6px; flex-shrink: 0; }
  .mono { width: 36px; height: 20.7px; overflow: visible; }
  .mono path { fill: none; stroke: var(--green); stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
  .home .sep { width: 1px; height: 16.2px; background: var(--line); }
  .back { font-size: 10.8px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--sage); transition: color .25s; }
  .back:hover, .back:focus-visible { color: var(--green); }
  .title { font-size: 15px; font-weight: 700; letter-spacing: .01em; color: var(--green); white-space: nowrap; }
  .progress { position: absolute; left: 0; bottom: 0; height: 1.4px; width: 100%; background: var(--sage); transform-origin: 0 50%; transform: scaleX(0); }

  /* ---- Option 1: chapters along the right of the bar, the current one underlined ---- */
  .o1 nav { margin-left: auto; }
  .chapters { position: relative; display: flex; gap: 23.4px; list-style: none; margin: 0; padding: 0; }
  .chapters a { display: block; padding: 7.2px 0; font-size: 10.8px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--sage); opacity: .75; transition: color .25s, opacity .25s; white-space: nowrap; }
  .chapters a:hover, .chapters a:focus-visible { opacity: 1; }
  .chapters a[aria-current="true"] { color: var(--green); opacity: 1; }
  /* the underline under the current chapter: 20% lighter than the green, 1.4px */
  .chapters .mark { position: absolute; bottom: 2px; left: 0; height: 1.4px; width: 0; background: #607a66; border-radius: 1px; transition: left .45s cubic-bezier(.3, .7, .2, 1), width .45s cubic-bezier(.3, .7, .2, 1), opacity .3s; opacity: 0; }

  /* narrower screens: tighter chapters, and below 900px the monogram alone leads back */
  @media (max-width: 1040px) and (min-width: 761px) {
    .chapters { gap: 12px; }
    .chapters a { letter-spacing: .08em; }
  }
  @media (max-width: 900px) and (min-width: 761px) {
    .o1 .home .sep, .o1 .home .back { display: none; }
  }

  /* ---- Option 2: a quiet bar; the chapters as a thread of dots down the left side ---- */
  .o2 .title { margin-left: auto; }
  .rail { position: fixed; left: 26px; top: 50%; transform: translateY(-50%); z-index: 9; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 26px; }
  .rail::before, .rail .done { content: ""; position: absolute; left: 5px; top: 6px; width: 1.5px; bottom: 6px; background: var(--line); }
  .rail .done { background: var(--sage); bottom: auto; height: 0; transition: height .45s cubic-bezier(.3, .7, .2, 1); }
  .rail li { position: relative; }
  .rail a { position: relative; display: block; width: 12px; height: 12px; }
  .rail a::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--sage); transition: transform .3s cubic-bezier(.3, 1.5, .5, 1), background .3s; }
  .rail a.past::before { background: var(--sage); }
  .rail a[aria-current="true"]::before { background: var(--green); border-color: var(--green); transform: scale(1.45); }
  .rail .tag {
    position: absolute; left: 24px; top: 50%; transform: translate(-6px, -50%); white-space: nowrap; pointer-events: none;
    padding: 5px 11px; border-radius: 14px; background: var(--green); color: #f5f6ee;
    font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; opacity: 0; transition: opacity .25s, transform .3s;
  }
  .rail .tag b { font-weight: 400; opacity: .7; margin-right: 7px; }
  .rail a:hover .tag, .rail a:focus-visible .tag, .rail a.flash .tag { opacity: 1; transform: translate(0, -50%); }

  /* which option is on */
  body:not(.opt1) .o1, body:not(.opt2) .o2, body:not(.opt2) .rail { display: none; }


  /* ---- Option 4 (phones): the current chapter in the bar, the rest in a dropdown ---- */
  .o4, .sheet { display: none; }
  @media (max-width: 760px) {
    .o1, .o2, .rail { display: none !important; }
    .o4 { display: flex; }
    .bar { height: 54px; padding: 0 12px 0 14px; gap: 10px; }
    .o4 .home .back { display: none; }
    .o4 .mono { width: 34px; height: 20px; }
    .now {
      margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 18px;
      background: rgba(245, 246, 238, .9); font: 500 12px/1 'Roboto', system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--green); cursor: pointer;
    }
    .now b { font-weight: 400; color: var(--sage); }
    .now svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1.6; transition: transform .3s; }
    .now[aria-expanded="true"] svg { transform: rotate(180deg); }
    .sheet {
      display: block; position: fixed; left: 10px; right: 10px; top: 62px; z-index: 11; margin: 0; padding: 8px; list-style: none;
      background: #fbfcf6; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(47, 74, 54, .18);
      opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.3, .7, .2, 1);
    }
    .sheet.open { opacity: 1; transform: none; pointer-events: auto; }
    .sheet a { display: flex; gap: 14px; padding: 12px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--sage); }
    .sheet a b { font-weight: 400; width: 20px; color: var(--line); color: rgba(83, 119, 92, .6); }
    .sheet a[aria-current="true"] { background: rgba(83, 119, 92, .12); color: var(--green); }
    .sheet .all { margin-top: 4px; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition-duration: .01s !important; } }
</style>

<script>
  // The chapters: the name shown in the menu, and where the chapter starts in the
  // Figma frame (its "anchor/…" layer). Rename them here.
  const CHAPTERS = [
    ['Context', 746],
    ['Approach', 3846],
    ['Landscape', 5613],
    ['Exploration', 8231],
    ['Patterns', 13934],
    ['Insights', 15752],
    ['Outcome', 17693],
    ['Reflection', 21248],
  ];
  const FRAME_H = 22122;

  const study = document.querySelector('.study');
  const num = i => String(i + 1).padStart(2, '0');
  CHAPTERS.forEach(([name, y], i) => {
    const a = document.createElement('span'); a.className = 'anchor'; a.id = 'ch-' + i; a.style.setProperty('--y', y); study.appendChild(a);
  });
  // the three menus, from the one list
  const chapters = document.querySelector('.chapters'), rail = document.querySelector('.rail'), sheet = document.querySelector('.sheet');
  const mark = document.createElement('span'); mark.className = 'mark'; chapters.appendChild(mark);
  CHAPTERS.forEach(([name], i) => {
    chapters.insertAdjacentHTML('beforeend', `<li><a href="#ch-${i}">${name}</a></li>`);
    rail.insertAdjacentHTML('beforeend', `<li><a href="#ch-${i}" aria-label="${num(i)} ${name}"><span class="tag"><b>${num(i)}</b>${name}</span></a></li>`);
    sheet.insertAdjacentHTML('beforeend', `<li><a href="#ch-${i}"><b>${num(i)}</b>${name}</a></li>`);
  });
  sheet.insertAdjacentHTML('beforeend', `<li><a class="all" href="../index.html#all-projects"><b>←</b>All projects</a></li>`);

  // the monogram's traced line, fitted to its box
  // (measured once, in a sketch svg off the page, since two of the three bars start hidden)
  {
    const sketch = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    sketch.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;height:10px';
    sketch.innerHTML = `<path d="${document.querySelector('.mono path').getAttribute('d')}"/>`;
    document.body.appendChild(sketch);
    const b = sketch.firstChild.getBBox(), pad = 2.5; sketch.remove();
    document.querySelectorAll('.mono').forEach(s => s.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.width + 2 * pad} ${b.height + 2 * pad}`));
  }

  // where each chapter starts on the page, in px, under the bar
  const barH = () => innerWidth <= 760 ? 54 : 57.6;
  const chapterTop = i => study.offsetTop + study.offsetHeight * CHAPTERS[i][1] / FRAME_H;
  document.querySelectorAll('a[href^="#ch-"]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const i = +a.getAttribute('href').slice(4);
    scrollTo({ top: chapterTop(i) - barH() + 2, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    closeSheet();
  }));

  // what's on screen: the current chapter, how far through, and whether we're past the cover
  const bars = [...document.querySelectorAll('.bar')], progress = [...document.querySelectorAll('.progress')];
  const nowLabel = document.querySelector('.now-label');
  let current = -2, flashTimer = 0;
  function update() {
    const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
    const coverEnd = study.offsetHeight * CHAPTERS[0][1] / FRAME_H - 80;
    bars.forEach(b => b.classList.toggle('solid', y > coverEnd));
    progress.forEach(p => p.style.transform = `scaleX(${max > 0 ? (y / max).toFixed(4) : 0})`);
    let on = -1;
    CHAPTERS.forEach((c, i) => { if (y + barH() + 60 >= chapterTop(i)) on = i; });
    if (max > 0 && y >= max - 2) on = CHAPTERS.length - 1;   // the last chapter is too short to reach the top
    if (on === current) return;
    current = on;
    document.querySelectorAll('.chapters a, .rail a, .sheet a[href^="#ch-"]').forEach(a => {
      const i = +a.getAttribute('href').slice(4);
      a.setAttribute('aria-current', i === on ? 'true' : 'false');
      a.classList.toggle('past', i < on);
    });
    // Option 1: the underline slides to the current chapter
    const link = on >= 0 ? chapters.querySelectorAll('a')[on] : null;
    if (link) { mark.style.left = link.offsetLeft + 'px'; mark.style.width = link.offsetWidth + 'px'; mark.style.opacity = 1; } else mark.style.opacity = 0;
    // Option 2: the thread fills to the current dot, whose name shows for a moment
    const dots = rail.querySelectorAll('a');
    rail.querySelector('.done').style.height = on >= 0 ? (dots[on].parentElement.offsetTop + 6 - 6) + 'px' : '0px';
    dots.forEach(d => d.classList.remove('flash'));
    clearTimeout(flashTimer);
    if (on >= 0) { dots[on].classList.add('flash'); flashTimer = setTimeout(() => dots[on].classList.remove('flash'), 1600); }
    // Option 4: the bar says where you are
    nowLabel.innerHTML = on >= 0 ? `<b>${num(on)}</b> ${CHAPTERS[on][0]}` : 'Overview';
  }
  addEventListener('scroll', update, { passive: true });
  addEventListener('resize', () => { current = -2; update(); });
  addEventListener('load', () => { current = -2; update(); });
  update();

  // Option 4: the dropdown
  const nowBtn = document.querySelector('.now');
  function closeSheet() { sheet.classList.remove('open'); nowBtn.setAttribute('aria-expanded', 'false'); }
  nowBtn.addEventListener('click', () => { const open = !sheet.classList.contains('open'); sheet.classList.toggle('open', open); nowBtn.setAttribute('aria-expanded', open); });
  addEventListener('click', e => { if (!e.target.closest('.sheet, .now')) closeSheet(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

</script>
