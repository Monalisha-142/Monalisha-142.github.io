<style>
  /* A project page, blank for now. The header is About me's (Figma "Frame 9"):
     the monogram, the fine line and the name, which take you home. */
  :root { --u: calc(100vw / 1440); }
  html, body { margin: 0; background: #000000; color: #ffffff; }
  body { font-family: 'Afacad', system-ui, sans-serif; opacity: 0; animation: arrive .6s ease .05s forwards; }
  @keyframes arrive { to { opacity: 1; } }
  body.leaving { opacity: 1; animation: none; transition: opacity .45s ease; }
  body.leaving.gone { opacity: 0; }

  header { position: sticky; top: 0; height: calc(79 * var(--u)); background: #000000; z-index: 1; }
  .home { position: absolute; inset: 0 auto 0 0; width: calc(330 * var(--u)); color: inherit; text-decoration: none; }
  .mono { position: absolute; left: calc(43 * var(--u)); top: calc(44 * var(--u)); width: calc(51 * var(--u)); height: calc(29 * var(--u)); overflow: visible; }
  .mono path { fill: none; stroke: #f0d7ae; stroke-width: 7.35; stroke-linecap: round; stroke-linejoin: round; }
  .divider { position: absolute; left: calc(95 * var(--u)); top: calc(49 * var(--u)); width: 1px; height: calc(18 * var(--u)); background: #ebeae6; }
  .name {
    position: absolute; left: calc(115 * var(--u)); top: calc(12 * var(--u)); margin: 0;
    font: 500 calc(32 * var(--u))/calc(90 * var(--u)) 'Beiruti', system-ui, sans-serif; letter-spacing: .13em; white-space: nowrap;
  }
  .back {
    position: absolute; right: calc(58 * var(--u)); top: calc(46 * var(--u));
    font: 400 calc(17 * var(--u))/1 'Afacad', system-ui, sans-serif; letter-spacing: .04em;
    color: #ffffff; text-decoration: none; transition: color .35s ease;
  }
  .back:hover, .back:focus-visible { color: #ebcea0; }

  main { padding: calc(110 * var(--u)) calc(115 * var(--u)) calc(160 * var(--u)); }
  h1 { margin: 0; font: 500 calc(55 * var(--u))/calc(58 * var(--u)) 'Afacad', system-ui, sans-serif; letter-spacing: .04em; }
  .lede { margin: calc(18 * var(--u)) 0 0; max-width: calc(551 * var(--u)); font: 500 calc(20 * var(--u))/calc(27 * var(--u)) 'Afacad', system-ui, sans-serif; letter-spacing: .04em; color: #959292; }
  .cover { margin-top: calc(56 * var(--u)); height: calc(560 * var(--u)); background: #d9d9d9; }

  @media (max-width: 760px) {
    header { height: 64px; }
    .home { width: 240px; }
    .mono { left: 16px; top: 22px; width: 36px; height: 21px; }
    .divider { left: 60px; top: 24px; height: 16px; }
    .name { left: 72px; top: 0; font-size: 22px; line-height: 64px; }
    .back { right: 16px; top: 24px; font-size: 15px; }
    main { padding: 48px 16px 96px; }
    h1 { font-size: 34px; line-height: 40px; }
    .lede { font-size: 16px; line-height: 23px; }
    .cover { margin-top: 32px; height: 56vw; }
  }
  @media (prefers-reduced-motion: reduce) { body { animation-duration: .01s; } }
</style>

  <main>

    <p class="lede">This project page is being put together.</p>
    <div class="cover" role="img" aria-label="Project image (coming soon)"></div>

<script>
  // the monogram's traced line, fitted to its box as on the main page
  const line = document.getElementById('mono-line'), b = line.getBBox(), pad = 2.5;
  line.ownerSVGElement.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.width + 2 * pad} ${b.height + 2 * pad}`);
  // home and back go to the main page that opened this one (Portfolio final,
  // or an older version being compared)
  let home = 'index.html';
  try {
    const from = document.referrer.includes('/projects/') ? null : (document.referrer.match(/\/([^\/?#]+\.html)(?:[?#]|$)/) || [])[1];
    if (from) sessionStorage.setItem('home', from);
    home = sessionStorage.getItem('home') || home;
  } catch (e) {}
  document.querySelectorAll('a.home, a.back').forEach(a => { a.href = '../' + home + a.getAttribute('href').replace(/^[^#]+/, ''); });
  // leaving: fade out, then go
  document.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    document.body.classList.add('leaving');
    requestAnimationFrame(() => document.body.classList.add('gone'));
    setTimeout(() => { location.href = a.href; }, 450);
  }));
  addEventListener('pageshow', () => document.body.classList.remove('leaving', 'gone'));
</script>
