<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rules, Rituals &amp; the Mid-Day Meal · S Monalisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* The Human Behavior case study (Figma "Human behavior project" › Frame 82), under the Behavior Design card.
     Desktop: the Ecotourism header (light bar, same sizes) in this study's brown, with reading progress. Inside a behavior, the other chapters shrink to
     icons and that behavior's own steps open on the right. Phone: a chapter dropdown.
     The case study itself is a picture of the Figma frame (1409 × 22911), without its own Nav. */
  :root { --bg: #fbf8f0; --ink: #3d2a14; --brown: #834e17; --soft: #7d5326; --line: rgba(131, 78, 23, .25); }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* no font boosting on phones */
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body { font-family: 'Roboto', system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }

  /* the case study: the Figma frame, 1409 × 22911, in pieces */
  .study { position: relative; }
  .study img { display: block; width: 100%; height: auto; }
  .anchor { position: absolute; left: 0; width: 1px; height: 1px; top: calc(var(--y) / 22911 * 100%); }

  /* ---- the bar ---- */
  .bar {
    position: fixed; inset: 0 0 auto 0; height: 57.6px; z-index: 10; display: flex; align-items: center; gap: 19.8px; padding: 0 36px;
    background: transparent; transition: background .35s ease, box-shadow .35s ease;
  }
  .bar.solid { background: rgba(251, 248, 240, .94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--line); }
  .home { display: flex; align-items: center; gap: 12.6px; flex-shrink: 0; }
  .mono { width: 36px; height: 20.7px; overflow: visible; }
  .mono path { fill: none; stroke: var(--brown); stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
  .home .sep { width: 1px; height: 16.2px; background: var(--line); }
  .back { font-size: 10.8px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); transition: color .25s; }
  .back:hover, .back:focus-visible { color: var(--brown); }
  .progress { position: absolute; left: 0; bottom: 0; height: 1.4px; width: 100%; background: var(--soft); transform-origin: 0 50%; transform: scaleX(0); }

  /* ---- the chapters, along the right of the bar ---- */
  .desk { margin-left: auto; }
  .chapters, .sub { display: flex; align-items: center; list-style: none; margin: 0; padding: 0; }
  .chapters { position: relative; gap: 23.4px; }
  .chapters > li { display: flex; align-items: center; }
  .chapters a { display: flex; align-items: center; padding: 7.2px 0; font-size: 10.8px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); opacity: .85; white-space: nowrap; transition: color .25s, opacity .25s; }
  .chapters a:hover, .chapters a:focus-visible { opacity: 1; }
  .chapters a[aria-current="true"] { color: var(--brown); opacity: 1; }
  /* each chapter has an icon (shown only inside a behavior) and a name */
  .ico { width: 0; height: 16px; flex-shrink: 0; overflow: visible; opacity: 0; transition: width .45s cubic-bezier(.3, .7, .2, 1), opacity .3s; }
  .ico * { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .ico text { fill: currentColor; stroke: none; font: 700 8.5px 'Roboto', system-ui, sans-serif; letter-spacing: 0; }
  .lbl { display: inline-block; max-width: 12em; overflow: hidden; transition: max-width .45s cubic-bezier(.3, .7, .2, 1), opacity .3s; }
  /* a behavior's own steps, closed until you're in it */
  .sub { gap: 20px; max-width: 0; overflow: hidden; opacity: 0; transition: max-width .55s cubic-bezier(.3, .7, .2, 1), opacity .35s, margin .45s; }
  .sub a { font-weight: 400; letter-spacing: .1em; }
  /* the underline under where you are: 20% lighter than the brown, 1.4px */
  .chapters .mark { position: absolute; bottom: 2px; left: 0; height: 1.4px; width: 0; background: #9c7145; border-radius: 1px; transition: left .45s cubic-bezier(.3, .7, .2, 1), width .45s cubic-bezier(.3, .7, .2, 1), opacity .3s; opacity: 0; pointer-events: none; }

  /* inside a behavior: the others become icons, this one opens its steps */
  .deep .chapters { gap: 14px; }
  .deep .chapters > li:not(.on) .ico { width: 16px; opacity: 1; }
  .deep .chapters > li:not(.on) .lbl { max-width: 0; opacity: 0; }
  .deep .chapters > li:not(.on) > a { position: relative; padding: 7.2px 2px; }
  .deep .chapters > li.on .ico { width: 16px; opacity: 1; margin-right: 8px; }
  .deep .chapters > li.on .ico circle { fill: var(--brown); }
  .deep .chapters > li.on .ico text { fill: #fbf8f0; }
  .deep .chapters > li.on > a { font-weight: 700; }
  .deep .chapters > li.on .sub { max-width: 640px; opacity: 1; margin: 0 6px 0 22px; }
  .deep .chapters > li.on .sub::before { content: ""; width: 1px; height: 14px; background: var(--line); margin-right: 2px; }
  /* the icons say what they are on hover */
  .deep .chapters > li:not(.on) > a::after {
    content: attr(data-name); position: absolute; top: calc(100% + 8px); left: 50%; transform: translate(-50%, -4px); pointer-events: none;
    padding: 5px 10px; border-radius: 12px; background: var(--brown); color: #fbf8f0; font-size: 10.5px; font-weight: 500; letter-spacing: .1em;
    opacity: 0; transition: opacity .2s, transform .25s;
  }
  .deep .chapters > li:not(.on) > a:hover::after, .deep .chapters > li:not(.on) > a:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }

  /* narrower screens: tighter chapters; in a behavior its number alone names it; below 900px the monogram alone leads back */
  @media (max-width: 1040px) and (min-width: 761px) {
    .chapters { gap: 12px; }
    .chapters a { letter-spacing: .08em; }
    .deep .chapters { gap: 10px; }
    .deep .chapters > li.on > a .lbl { max-width: 0; opacity: 0; }
    .deep .chapters > li.on .ico { margin-right: 0; }
    .deep .chapters > li.on .sub { margin: 0 4px 0 12px; gap: 14px; }
  }
  @media (max-width: 900px) and (min-width: 761px) {
    .home .sep, .home .back { display: none; }
  }

  /* ---- phones: where you are in the bar, every chapter and step in a dropdown ---- */
  .now, .sheet { display: none; }
  @media (max-width: 760px) {
    .desk { display: none; }
    .bar { height: 54px; padding: 0 12px 0 14px; gap: 10px; }
    .home .sep, .home .back { display: none; }
    .mono { width: 34px; height: 20px; }
    .now {
      margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 18px;
      background: rgba(251, 248, 240, .92); font: 500 12px/1 'Roboto', system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--brown); cursor: pointer;
    }
    .now b { font-weight: 400; color: var(--soft); }
    .now svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1.6; transition: transform .3s; }
    .now[aria-expanded="true"] svg { transform: rotate(180deg); }
    .sheet {
      display: block; position: fixed; left: 10px; right: 10px; top: 62px; z-index: 11; margin: 0; padding: 8px; list-style: none;
      max-height: calc(100vh - 80px); overflow-y: auto; overscroll-behavior: contain;
      background: #fdfbf5; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(61, 42, 20, .18);
      opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.3, .7, .2, 1);
    }
    .sheet.open { opacity: 1; transform: none; pointer-events: auto; }
    .sheet ul { list-style: none; margin: 0 0 4px; padding: 0 0 0 34px; }
    .sheet a { display: flex; gap: 14px; padding: 11px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
    .sheet ul a { padding: 8px 12px; font-size: 12.5px; font-weight: 400; letter-spacing: .08em; }
    .sheet a b { font-weight: 400; width: 20px; color: rgba(131, 78, 23, .55); }
    .sheet a[aria-current="true"] { background: rgba(131, 78, 23, .1); color: var(--brown); }
    .sheet .all { margin-top: 4px; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition-duration: .01s !important; } }
</style>

<script>
  // The chapters: the name in the menu, where it starts in the Figma frame (y in Frame 82),
  // its icon (a small circle with a letter or number, all alike), and for a behavior, its own steps.
  // Rename or move them here.
  const badge = t => `<circle cx="8" cy="8" r="6.6"/><text x="8" y="11" text-anchor="middle">${t}</text>`;
  const CHAPTERS = [
    { name: 'Context',      y: 784,   icon: badge('C') },
    { name: 'Patterns',     y: 1568,  icon: badge('P') },
    { name: 'Field lenses', y: 2232,  icon: badge('F') },
    { name: 'Behavior 1',   y: 5363,  icon: badge(1), steps: [['Observation', 5363], ['Simulation', 6090], ['Proposal', 7563], ['Pilot & Measure', 10536]] },
    { name: 'Behavior 2',   y: 11425, icon: badge(2), steps: [['Observation', 11425], ['Simulation', 13284], ['Proposal', 14694], ['Pilot & test plan', 17405]] },
    { name: 'Behavior 3',   y: 18022, icon: badge(3), steps: [['Observation', 18022], ['Simulation', 19241], ['Proposal', 20721], ['Pilot test', 22203]] },
  ];
  const FRAME_H = 22911;

  const study = document.querySelector('.study');
  const num = i => String(i + 1).padStart(2, '0');
  const esc = s => s.replace(/&/g, '&amp;');
  const anchor = (id, y) => { const a = document.createElement('span'); a.className = 'anchor'; a.id = id; a.style.setProperty('--y', y); study.appendChild(a); };
  CHAPTERS.forEach((c, i) => { anchor('ch-' + i, c.y); (c.steps || []).forEach((s, j) => anchor(`ch-${i}-${j}`, s[1])); });

  // the two menus, from the one list
  const chapters = document.querySelector('.chapters'), sheet = document.querySelector('.sheet'), nav = document.querySelector('.desk');
  CHAPTERS.forEach((c, i) => {
    const steps = (c.steps || []).map((s, j) => `<li><a href="#ch-${i}-${j}">${esc(s[0])}</a></li>`).join('');
    chapters.insertAdjacentHTML('beforeend', `<li><a href="#ch-${i}" data-name="${c.name}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">${c.icon}</svg><span class="lbl">${c.name}</span></a>${steps ? `<ul class="sub" aria-label="${c.name}">${steps}</ul>` : ''}</li>`);
    sheet.insertAdjacentHTML('beforeend', `<li><a href="#ch-${i}"><b>${num(i)}</b>${c.name}</a>${steps ? `<ul>${steps}</ul>` : ''}</li>`);
  });
  sheet.insertAdjacentHTML('beforeend', `<li><a class="all" href="../index.html#all-projects"><b>←</b>All projects</a></li>`);
  const mark = document.createElement('span'); mark.className = 'mark'; chapters.appendChild(mark);

  // the monogram's traced line, fitted to its box
  {
    const p = document.querySelector('.mono path'), b = p.getBBox(), pad = 2.5;
    p.ownerSVGElement.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.width + 2 * pad} ${b.height + 2 * pad}`);
  }

  // where a chapter or step starts on the page, in px, under the bar
  const barH = () => innerWidth <= 760 ? 54 : 57.6;
  const pageY = y => study.offsetTop + study.offsetHeight * y / FRAME_H;
  const yOf = href => { const [i, j] = href.slice(4).split('-').map(Number); return j >= 0 ? CHAPTERS[i].steps[j][1] : CHAPTERS[i].y; };
  document.querySelectorAll('a[href^="#ch-"]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    scrollTo({ top: pageY(yOf(a.getAttribute('href'))) - barH() + 2, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    closeSheet();
  }));

  // the underline follows its link while the menu reshapes
  let markFor = null, followUntil = 0;
  function placeMark() {
    if (!markFor) { mark.style.opacity = 0; return; }
    const r = markFor.getBoundingClientRect(), base = chapters.getBoundingClientRect();
    mark.style.left = (r.left - base.left) + 'px'; mark.style.width = r.width + 'px'; mark.style.opacity = 1;
  }
  function follow() { placeMark(); if (performance.now() < followUntil) requestAnimationFrame(follow); }

  // what's on screen: the chapter and step, how far through, and whether we're past the cover
  const bar = document.querySelector('.bar'), progress = document.querySelector('.progress'), nowLabel = document.querySelector('.now-label');
  let current = '';
  function update() {
    const y = scrollY, max = document.documentElement.scrollHeight - innerHeight, line = y + barH() + 60;
    bar.classList.toggle('solid', y > pageY(CHAPTERS[0].y) - 80);
    progress.style.transform = `scaleX(${max > 0 ? (y / max).toFixed(4) : 0})`;
    let on = -1, step = -1;
    CHAPTERS.forEach((c, i) => { if (line >= pageY(c.y)) on = i; });
    const atEnd = max > 0 && y >= max - 2;   // the last step is too short to reach the top
    if (atEnd) on = CHAPTERS.length - 1;
    const steps = on >= 0 && CHAPTERS[on].steps;
    if (steps) { steps.forEach((s, j) => { if (line >= pageY(s[1])) step = j; }); if (atEnd) step = steps.length - 1; if (step < 0) step = 0; }
    const key = on + '.' + step;
    if (key === current) return;
    current = key;
    nav.classList.toggle('deep', !!steps);
    [...chapters.children].forEach((li, i) => li.classList && li.classList.toggle('on', i === on));
    document.querySelectorAll('a[href^="#ch-"]').forEach(a => {
      const h = a.getAttribute('href');
      a.setAttribute('aria-current', h === (steps ? `#ch-${on}-${step}` : `#ch-${on}`) || h === `#ch-${on}` ? 'true' : 'false');
    });
    markFor = on < 0 ? null : chapters.querySelector(`a[href="${steps ? `#ch-${on}-${step}` : `#ch-${on}`}"]`);
    followUntil = performance.now() + 700; follow();
    nowLabel.innerHTML = on < 0 ? 'Overview' : steps ? `<b>B${on - 2}</b> ${esc(steps[step][0])}` : `<b>${num(on)}</b> ${CHAPTERS[on].name}`;
  }
  addEventListener('scroll', update, { passive: true });
  addEventListener('resize', () => { current = ''; update(); });
  addEventListener('load', () => { current = ''; update(); });
  update();

  // phones: the dropdown
  const nowBtn = document.querySelector('.now');
  function closeSheet() { sheet.classList.remove('open'); nowBtn.setAttribute('aria-expanded', 'false'); }
  nowBtn.addEventListener('click', () => { const open = !sheet.classList.contains('open'); sheet.classList.toggle('open', open); nowBtn.setAttribute('aria-expanded', open); });
  addEventListener('click', e => { if (!e.target.closest('.sheet, .now')) closeSheet(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
</script>
</body>
</html>
